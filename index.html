<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics -->

    <script>
      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());
      gtag('config', 'G-XPY02L4JYV');

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Out — 멍때리기</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #87ceeb;
      }
      canvas {
        display: block;
      }
      #title {
        position: fixed;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.55);
        font-family: 'Georgia', 'Palatino', serif;
        font-size: 1.4rem;
        letter-spacing: 0.7em;
        font-weight: 300;
        text-transform: lowercase;
        pointer-events: none;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.08);
        user-select: none;
      }
      #audio-ctrl {
        position: fixed;
        bottom: 28px;
        right: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 40px;
        padding: 9px 18px 9px 14px;
        user-select: none;
        transition: background 0.2s;
      }
      #audio-ctrl:hover {
        background: rgba(255, 255, 255, 0.28);
      }
      #mute-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-size: 1.25rem;
        line-height: 1;
        color: rgba(255, 255, 255, 0.85);
        transition: transform 0.15s;
      }
      #mute-btn:hover {
        transform: scale(1.15);
      }
      #vol-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 90px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.4);
        outline: none;
        cursor: pointer;
      }
      #vol-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="title">space out</div>

    <audio id="bgm" src="음악.mp3" loop preload="auto"></audio>
    <div id="audio-ctrl">
      <button id="mute-btn" title="음소거 토글">🔊</button>
      <input
        id="vol-slider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
        title="볼륨 조절"
      />
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // ── Clouds ──────────────────────────────────────────────────────────
      const clouds = Array.from({ length: 6 }, (_, i) => ({
        x: Math.random() * W * 1.5,
        y: H * (0.05 + Math.random() * 0.28),
        speed: 0.12 + Math.random() * 0.18,
        size: 55 + Math.random() * 90,
        opacity: 0.72 + Math.random() * 0.25,
      }));

      function drawCloud(c) {
        ctx.save();
        ctx.globalAlpha = c.opacity;
        ctx.fillStyle = '#FFFFFF';
        const s = c.size;
        ctx.beginPath();
        ctx.arc(c.x, c.y, s * 0.5, 0, Math.PI * 2);
        ctx.arc(c.x + s * 0.42, c.y + s * 0.05, s * 0.42, 0, Math.PI * 2);
        ctx.arc(c.x - s * 0.35, c.y + s * 0.05, s * 0.36, 0, Math.PI * 2);
        ctx.arc(c.x + s * 0.12, c.y - s * 0.32, s * 0.44, 0, Math.PI * 2);
        ctx.arc(c.x - s * 0.08, c.y + s * 0.18, s * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // ── Flowers ─────────────────────────────────────────────────────────
      const FLOWER_COLORS = [
        '#FF7BAE',
        '#FFD966',
        '#FF9EC4',
        '#FFF07C',
        '#AEE9A0',
        '#FFB347',
      ];
      const flowers = Array.from({ length: 38 }, () => ({
        x: Math.random() * W,
        y: 0, // set after H is known
        color: FLOWER_COLORS[Math.floor(Math.random() * FLOWER_COLORS.length)],
        size: 2.8 + Math.random() * 2.8,
        phase: Math.random() * Math.PI * 2,
      }));

      function initFlowers() {
        flowers.forEach((f) => {
          f.x = Math.random() * W;
          f.y = H * (0.73 + Math.random() * 0.24);
        });
      }
      initFlowers();
      window.addEventListener('resize', initFlowers);

      function drawFlowers(t) {
        flowers.forEach((f) => {
          const stemLen = f.size * 3.5;
          ctx.strokeStyle = '#4CAF50';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(f.x, f.y - stemLen);
          ctx.stroke();

          const cx = f.x,
            cy = f.y - stemLen;
          const PETALS = 5;
          ctx.fillStyle = f.color;
          for (let i = 0; i < PETALS; i++) {
            const a = (i / PETALS) * Math.PI * 2 + f.phase;
            ctx.beginPath();
            ctx.ellipse(
              cx + Math.cos(a) * f.size * 1.6,
              cy + Math.sin(a) * f.size * 1.6,
              f.size,
              f.size * 0.6,
              a,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
          ctx.fillStyle = '#FFE033';
          ctx.beginPath();
          ctx.arc(cx, cy, f.size * 0.75, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // ── Sheep ────────────────────────────────────────────────────────────
      class Sheep {
        constructor(idx) {
          this.size = 0.65 + Math.random() * 0.55;
          this.woolTint = Math.random() < 0.15 ? '#C8D8C0' : '#F3F0E6'; // mostly white, rare gray-green
          this.x = 80 + Math.random() * (W - 160);
          this.y = 0;
          this.targetX = this.x;
          this.targetY = this.y;
          this.speed = 0.4 + Math.random() * 0.45;
          this.walkTime = Math.random() * Math.PI * 2;
          this.facing = Math.random() < 0.5 ? 1 : -1; // +1 = right
          this.state = 'idle';
          this.stateTimer = Math.random() * 3000;
          this.stateDuration = 1500 + Math.random() * 4000;
          this.initY();
        }

        initY() {
          this.y = H * (0.72 + Math.random() * 0.2);
          this.targetY = this.y;
        }

        pickNewTarget() {
          const r = Math.random();
          if (r < 0.18) {
            this.targetX = -(80 + Math.random() * 120); // 왼쪽으로 퇴장
          } else if (r < 0.36) {
            this.targetX = W + 80 + Math.random() * 120; // 오른쪽으로 퇴장
          } else {
            this.targetX = 60 + Math.random() * (W - 120);
          }
          this.targetY = H * (0.72 + Math.random() * 0.2);
        }

        update(dt) {
          this.stateTimer += dt;

          if (this.stateTimer >= this.stateDuration) {
            this.stateTimer = 0;
            this.stateDuration = 1200 + Math.random() * 5000;
            const r = Math.random();
            if (r < 0.55) {
              this.state = 'walk';
              this.pickNewTarget();
            } else if (r < 0.8) {
              this.state = 'graze';
            } else {
              this.state = 'idle';
            }
          }

          if (this.state === 'walk') {
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 4) {
              const step = this.speed * dt * 0.048;
              this.x += (dx / dist) * step;
              this.y += (dy / dist) * step;
              this.facing = dx > 0 ? 1 : -1;
              this.walkTime += dt * 0.0048;
            } else {
              this.state = 'idle';
            }
          }

          // x는 화면 밖까지 허용 (퇴장 가능), y만 초원 범위 제한
          this.x = Math.max(-250, Math.min(W + 250, this.x));
          this.y = Math.max(H * 0.7, Math.min(H * 0.93, this.y));
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.scale(this.size, this.size);
          if (this.facing < 0) ctx.scale(-1, 1);

          const grazing = this.state === 'graze';
          const headTip = grazing ? 0.55 : 0.0;
          const swing =
            this.state === 'walk' ? Math.sin(this.walkTime) * 0.28 : 0;

          // ── legs ──
          this.drawLegs(swing);
          // ── body (wool) ──
          this.drawBody();
          // ── head ──
          this.drawHead(headTip);

          ctx.restore();
        }

        drawBody() {
          const w = this.woolTint;
          ctx.fillStyle = w;
          const blobs = [
            [0, -14, 20],
            [16, -10, 17],
            [-16, -10, 16],
            [8, -26, 15],
            [-8, -24, 14],
            [22, -22, 13],
            [-20, -20, 12],
            [0, -4, 16],
          ];
          blobs.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          });
          // tail
          ctx.fillStyle = w;
          ctx.beginPath();
          ctx.arc(-25, -10, 8, 0, Math.PI * 2);
          ctx.fill();
        }

        drawHead(tipAngle) {
          ctx.save();
          ctx.translate(26, -20);
          ctx.rotate(tipAngle);

          // head shape
          ctx.fillStyle = '#D4C8B0';
          ctx.beginPath();
          ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2);
          ctx.fill();

          // ear
          ctx.fillStyle = '#C2B09A';
          ctx.beginPath();
          ctx.ellipse(3, -10, 5, 4, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#E8A0A0';
          ctx.beginPath();
          ctx.ellipse(3, -10, 3, 2.5, -0.4, 0, Math.PI * 2);
          ctx.fill();

          // eye
          ctx.fillStyle = '#2A2010';
          ctx.beginPath();
          ctx.arc(8, -2, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.beginPath();
          ctx.arc(9, -3, 1.1, 0, Math.PI * 2);
          ctx.fill();

          // nose
          ctx.fillStyle = '#A87860';
          ctx.beginPath();
          ctx.ellipse(12, 3, 3.5, 2.2, 0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        drawLegs(swing) {
          const pairs = [
            { x: -10, phase: swing },
            { x: 2, phase: -swing },
            { x: 12, phase: swing },
            { x: 20, phase: -swing },
          ];
          pairs.forEach((p) => {
            ctx.save();
            ctx.translate(p.x, -4);
            ctx.rotate(p.phase);
            ctx.fillStyle = '#4A3020';
            ctx.beginPath();
            ctx.roundRect(-3.5, 0, 7, 22, 2);
            ctx.fill();
            ctx.fillStyle = '#2A1A0C';
            ctx.beginPath();
            ctx.roundRect(-4, 18, 8, 6, 2);
            ctx.fill();
            ctx.restore();
          });
        }
      }

      // ── Sheep 관리 ───────────────────────────────────────────────────────
      const MAX_SHEEP = 10;
      let sheepList = [];
      let spawnCooldown = 0;

      function spawnFromEdge() {
        const s = new Sheep();
        const fromLeft = Math.random() < 0.5;
        s.x = fromLeft ? -60 : W + 60;
        s.y = H * (0.72 + Math.random() * 0.2);
        s.targetY = s.y;
        s.targetX = fromLeft
          ? 120 + Math.random() * (W * 0.75)
          : W * 0.25 + Math.random() * (W * 0.75);
        s.facing = fromLeft ? 1 : -1;
        s.state = 'walk';
        s.stateTimer = 0;
        s.stateDuration = 2000 + Math.random() * 4000;
        return s;
      }

      // 초기 양들은 화면 위에 랜덤 배치
      sheepList = Array.from({ length: 7 }, () => {
        const s = new Sheep();
        s.initY();
        return s;
      });

      // ── Draw scene ───────────────────────────────────────────────────────
      function drawSky() {
        const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
        g.addColorStop(0.0, '#5BA8CC');
        g.addColorStop(0.5, '#8FCDE0');
        g.addColorStop(1.0, '#BDE8F4');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function drawSun() {
        const sx = W * 0.84,
          sy = H * 0.1;
        const glow = ctx.createRadialGradient(sx, sy, 20, sx, sy, 90);
        glow.addColorStop(0, 'rgba(255,235,100,0.38)');
        glow.addColorStop(1, 'rgba(255,235,100,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sx - 90, sy - 90, 180, 180);

        const sunG = ctx.createRadialGradient(sx, sy, 0, sx, sy, 36);
        sunG.addColorStop(0, '#FFFBC0');
        sunG.addColorStop(0.5, '#FFD700');
        sunG.addColorStop(1, '#FFA500');
        ctx.fillStyle = sunG;
        ctx.beginPath();
        ctx.arc(sx, sy, 36, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawHills() {
        // far hill
        ctx.fillStyle = '#79C268';
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.bezierCurveTo(
          W * 0.1,
          H * 0.52,
          W * 0.32,
          H * 0.48,
          W * 0.52,
          H * 0.57,
        );
        ctx.bezierCurveTo(W * 0.72, H * 0.65, W * 0.85, H * 0.5, W, H * 0.58);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // mid hill
        ctx.fillStyle = '#5BB849';
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.bezierCurveTo(
          W * 0.18,
          H * 0.6,
          W * 0.38,
          H * 0.56,
          W * 0.58,
          H * 0.64,
        );
        ctx.bezierCurveTo(W * 0.75, H * 0.7, W * 0.88, H * 0.59, W, H * 0.64);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // near grass
        ctx.fillStyle = '#4CAF3C';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.72);
        ctx.bezierCurveTo(
          W * 0.22,
          H * 0.68,
          W * 0.48,
          H * 0.72,
          W * 0.74,
          H * 0.69,
        );
        ctx.bezierCurveTo(W * 0.87, H * 0.67, W * 1.0, H * 0.7, W, H * 0.7);
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        // grass shadow strip
        ctx.fillStyle = '#3D9A30';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.73);
        ctx.bezierCurveTo(
          W * 0.3,
          H * 0.705,
          W * 0.65,
          H * 0.735,
          W,
          H * 0.715,
        );
        ctx.lineTo(W, H * 0.745);
        ctx.bezierCurveTo(
          W * 0.65,
          H * 0.765,
          W * 0.3,
          H * 0.735,
          0,
          H * 0.755,
        );
        ctx.closePath();
        ctx.fill();
      }

      function drawGrassBlades(t) {
        ctx.strokeStyle = '#3A9C28';
        ctx.lineWidth = 1.2;
        const baseY = H * 0.72;
        for (let x = 0; x < W; x += 18) {
          const by = baseY + Math.sin(x * 0.08) * 4;
          const sway = Math.sin(t * 0.0006 + x * 0.04) * 3;
          ctx.beginPath();
          ctx.moveTo(x, by);
          ctx.quadraticCurveTo(x + sway, by - 12, x + sway * 1.6, by - 20);
          ctx.stroke();
        }
      }

      // ── Main loop ────────────────────────────────────────────────────────
      let lastTS = 0;
      function animate(ts) {
        const dt = Math.min(ts - lastTS, 60); // cap dt
        lastTS = ts;

        ctx.clearRect(0, 0, W, H);

        drawSky();
        drawSun();

        clouds.forEach((c) => {
          c.x += c.speed;
          if (c.x > W + c.size * 2) c.x = -c.size * 2;
          drawCloud(c);
        });

        drawHills();
        drawGrassBlades(ts);
        drawFlowers(ts);

        // 화면 밖으로 완전히 나간 양 제거
        sheepList = sheepList.filter((s) => s.x > -220 && s.x < W + 220);

        // 10마리 미만이면 가장자리에서 새 양 등장 (간격 두고)
        spawnCooldown -= dt;
        if (sheepList.length < MAX_SHEEP && spawnCooldown <= 0) {
          sheepList.push(spawnFromEdge());
          spawnCooldown = 2500 + Math.random() * 3000;
        }

        // Sort by y for depth
        sheepList.sort((a, b) => a.y - b.y);
        sheepList.forEach((s) => {
          s.update(dt);
          s.draw();
        });

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);

      // ── 오디오 컨트롤 ─────────────────────────────────────────────────────
      const bgm = document.getElementById('bgm');
      const muteBtn = document.getElementById('mute-btn');
      const volSlider = document.getElementById('vol-slider');

      bgm.volume = 0.5;

      // 첫 클릭 시 재생 (브라우저 autoplay 정책)
      function startBgm() {
        bgm.play().catch(() => {});
        document.removeEventListener('click', startBgm);
        document.removeEventListener('keydown', startBgm);
      }
      document.addEventListener('click', startBgm);
      document.addEventListener('keydown', startBgm);

      volSlider.addEventListener('input', () => {
        bgm.volume = parseFloat(volSlider.value);
        bgm.muted = bgm.volume === 0;
        muteBtn.textContent = bgm.muted ? '🔇' : '🔊';
      });

      muteBtn.addEventListener('click', () => {
        bgm.muted = !bgm.muted;
        muteBtn.textContent = bgm.muted ? '🔇' : '🔊';
        if (!bgm.muted && bgm.paused) bgm.play().catch(() => {});
      });
    </script>
  </body>
</html>
